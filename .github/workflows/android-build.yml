name: Compile Android APK

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Flutter Specifique
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Forcer la création des dossiers d'assets manquants
        run: |
          mkdir -p assets/images
          mkdir -p assets/fonts
          mkdir -p assets/icons
          touch assets/images/.gitkeep
          touch assets/fonts/.gitkeep
          touch assets/icons/.gitkeep

      - name: Récupérer les paquets de l'application
        run: flutter pub get

      - name: Compiler en APK officiel
        run: flutter build apk --release --no-tree-shake-icons

      - name: Sauvegarder l'APK fini
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Application-Android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
