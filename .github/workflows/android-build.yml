name: Compile Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Flutter Specifique
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Correction dynamique de l'arborescence des assets
        run: |
          # Se placer dans le dossier mobile
          cd mobile
          
          # Créer les dossiers localement dans l'application
          mkdir -p assets/images assets/fonts assets/icons
          touch assets/images/.gitkeep assets/fonts/.gitkeep assets/icons/.gitkeep
          
          # Résoudre le problème du double répertoire imbriqué (my_vehicle/mobile)
          # en créant un lien symbolique ou un dossier jumeau exigé par le pubspec de l'auteur
          mkdir -p my_vehicle/mobile/assets/images
          mkdir -p my_vehicle/mobile/assets/fonts
          mkdir -p my_vehicle/mobile/assets/icons
          
          # Copier les fichiers de sécurité pour valider la présence
          cp -r assets/* my_vehicle/mobile/assets/

      - name: Récupérer les paquets et compiler l'APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Sauvegarder l'APK fini
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Application-Android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
