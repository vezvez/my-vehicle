name: Compile Android APK

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generer le dossier android manquant
        run: flutter create . --platforms=android

      - name: Creer les dossiers d'images vides requis
        run: |
          mkdir -p assets/images assets/fonts assets/icons
          touch assets/images/.gitkeep assets/fonts/.gitkeep assets/icons/.gitkeep

      - name: Configurer l'analyseur pour accepter l'experience
        run: |
          echo "analyzer:" > analysis_options.yaml
          echo "  enable-experiment:" >> analysis_options.yaml
          echo "    - dot-shorthands" >> analysis_options.yaml

      - name: Recuperer les paquets
        run: flutter pub get --enable-experiment=dot-shorthands

      - name: Compiler l'APK avec l'autorisation experimentale
        run: flutter build apk --release --no-tree-shake-icons --extra-front-end-options=--enable-experiment=dot-shorthands
