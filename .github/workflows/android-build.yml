name: Compile Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Flutter Specifique
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Récupérer les paquets
        run: |
          cd mobile
          flutter pub get

      - name: Compiler en APK avec la bonne cible
        run: |
          cd mobile
          flutter build apk --release --target=lib/main_development.dart --no-tree-shake-icons

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Application-Android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
