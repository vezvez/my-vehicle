name: Diagnostics et Compilation APK

on:
  workflow_dispatch:

jobs:
  diagnose-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: LST — Afficher les fichiers disponibles
        run: |
          echo "=== CONTENU DU DOSSIER LIB ==="
          ls -R mobile/lib || echo "Dossier mobile/lib introuvable"
          echo "=== CONTENU DE TOUT LE DOSSIER MOBILE ==="
          ls -R mobile

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Flutter Specifique
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Récupérer les paquets
        run: |
          cd mobile
          flutter pub get

      - name: Tenter une compilation automatique par défaut
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons
