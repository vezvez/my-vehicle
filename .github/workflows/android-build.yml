name: Compile Android APK

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generer le dossier android manquant
        run: flutter create . --platforms=android

      - name: Creer les dossiers d'images vides requis
        run: |
          mkdir -p assets/images assets/fonts assets/icons
          touch assets/images/.gitkeep assets/fonts/.gitkeep assets/icons/.gitkeep

      - name: Recuperer les paquets
        run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Sauvegarder l'APK fini
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Application-Android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
